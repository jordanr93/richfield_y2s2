<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Development strategy decision map</title>
  <desc id="desc">A visual decision path from business requirements through software acquisition options to evaluation and management approval.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker>
    <style>
      .bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:2}.accent{fill:#261a3d;stroke:#bc8cff;stroke-width:2}.good{fill:#102a1c;stroke:#3fb950;stroke-width:2}.warn{fill:#33270f;stroke:#d29922;stroke-width:2}.line{stroke:#8b949e;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .title{fill:#f0f6fc;font:700 30px Arial}.head{fill:#f0f6fc;font:700 20px Arial}.text{fill:#c9d1d9;font:16px Arial}.small{fill:#8b949e;font:14px Arial}.tag{fill:#bc8cff;font:700 14px Arial}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620" rx="22"/>
  <text class="title" x="50" y="55">Development strategy: from diagnosis to approval</text>
  <rect class="accent" x="50" y="100" width="250" height="150" rx="16"/>
  <text class="head" x="75" y="137">1. Diagnose the need</text>
  <text class="text" x="75" y="172">• Unique requirements?</text><text class="text" x="75" y="202">• Legacy constraints?</text><text class="text" x="75" y="232">• Skills, time and risk?</text>
  <path class="line" d="M300 175 H365"/>
  <rect class="panel" x="370" y="100" width="290" height="150" rx="16"/>
  <text class="head" x="395" y="137">2. Compare options</text>
  <text class="text" x="395" y="172">Build • Buy • Customise</text><text class="text" x="395" y="202">User app • Outsource</text><text class="text" x="395" y="232">Offshore • SaaS • Hybrid</text>
  <path class="line" d="M660 175 H725"/>
  <rect class="warn" x="730" y="100" width="420" height="150" rx="16"/>
  <text class="head" x="755" y="137">3. Test the real cost and risk</text>
  <text class="text" x="755" y="172">TCO • ROI • Payback • NPV</text><text class="text" x="755" y="202">Fit • Integration • Security • Scale</text><text class="text" x="755" y="232">Vendor viability • Support • Exit plan</text>
  <path class="line" d="M940 250 V310"/>
  <rect class="panel" x="730" y="315" width="420" height="160" rx="16"/>
  <text class="head" x="755" y="352">4. Acquire evidence</text>
  <text class="text" x="755" y="387">RFP: vendor proposes the solution</text><text class="text" x="755" y="417">RFQ: known item, comparable price</text><text class="text" x="755" y="447">Benchmarks • Tests • References • SLAs</text>
  <path class="line" d="M730 395 H665"/>
  <rect class="good" x="370" y="315" width="290" height="160" rx="16"/>
  <text class="head" x="395" y="352">5. Recommend</text>
  <text class="text" x="395" y="387">State preferred option</text><text class="text" x="395" y="417">Explain trade-offs</text><text class="text" x="395" y="447">Define conditions and controls</text>
  <path class="line" d="M370 395 H305"/>
  <rect class="accent" x="50" y="315" width="250" height="160" rx="16"/>
  <text class="head" x="75" y="352">6. Management decision</text>
  <text class="text" x="75" y="387">Proceed</text><text class="text" x="75" y="417">Revise / investigate</text><text class="text" x="75" y="447">Stop</text>
  <path class="line" d="M175 475 V525 H510"/>
  <rect class="panel" x="515" y="505" width="340" height="70" rx="16"/>
  <text class="tag" x="540" y="535">SYSTEM REQUIREMENTS DOCUMENT</text><text class="small" x="540" y="558">requirements • alternatives • costs • recommendation</text>
</svg>
