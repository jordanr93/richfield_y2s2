<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Order system entity relationship diagram using crow's-foot notation</title>
  <desc id="desc">Customer has zero or many orders. Each order has one or many order lines. Each product can appear on zero or many order lines. One supplier supplies zero or many products.</desc>
  <defs><style>.bg{fill:#0d1117}.entity{fill:#161b22;stroke:#bc8cff;stroke-width:3}.headbox{fill:#261a3d}.title{fill:#f0f6fc;font:700 30px Arial}.name{fill:#f0f6fc;font:700 21px Arial}.field{fill:#c9d1d9;font:16px Consolas,monospace}.pk{fill:#3fb950;font:700 15px Arial}.fk{fill:#d29922;font:700 15px Arial}.rel{stroke:#58c4dd;stroke-width:3;fill:none}.label{fill:#8b949e;font:14px Arial}.legend{fill:#c9d1d9;font:15px Arial}</style></defs>
  <rect class="bg" width="1200" height="760" rx="22"/><text class="title" x="45" y="52">Order ERD — crow's-foot cardinality</text>
  <g transform="translate(55 105)"><rect class="entity" width="255" height="190" rx="14"/><path class="headbox" d="M0 14Q0 0 14 0H241Q255 0 255 14V52H0Z"/><text class="name" x="72" y="34">CUSTOMER</text><text class="pk" x="20" y="83">PK</text><text class="field" x="62" y="83">CustomerNo</text><text class="field" x="62" y="113">Name</text><text class="field" x="62" y="143">Email</text><text class="field" x="62" y="173">Address</text></g>
  <g transform="translate(470 105)"><rect class="entity" width="255" height="190" rx="14"/><path class="headbox" d="M0 14Q0 0 14 0H241Q255 0 255 14V52H0Z"/><text class="name" x="91" y="34">ORDER</text><text class="pk" x="20" y="83">PK</text><text class="field" x="62" y="83">OrderNo</text><text class="fk" x="20" y="113">FK</text><text class="field" x="62" y="113">CustomerNo</text><text class="field" x="62" y="143">OrderDate</text><text class="field" x="62" y="173">Status</text></g>
  <g transform="translate(470 480)"><rect class="entity" width="255" height="190" rx="14"/><path class="headbox" d="M0 14Q0 0 14 0H241Q255 0 255 14V52H0Z"/><text class="name" x="53" y="34">ORDER_LINE</text><text class="pk" x="20" y="83">PK/FK</text><text class="field" x="78" y="83">OrderNo</text><text class="pk" x="20" y="113">PK/FK</text><text class="field" x="78" y="113">ProductNo</text><text class="field" x="78" y="143">Quantity</text><text class="field" x="78" y="173">SellingPrice</text></g>
  <g transform="translate(890 480)"><rect class="entity" width="255" height="190" rx="14"/><path class="headbox" d="M0 14Q0 0 14 0H241Q255 0 255 14V52H0Z"/><text class="name" x="78" y="34">PRODUCT</text><text class="pk" x="20" y="83">PK</text><text class="field" x="62" y="83">ProductNo</text><text class="fk" x="20" y="113">FK</text><text class="field" x="62" y="113">SupplierNo</text><text class="field" x="62" y="143">Description</text><text class="field" x="62" y="173">UnitPrice</text></g>
  <g transform="translate(890 105)"><rect class="entity" width="255" height="190" rx="14"/><path class="headbox" d="M0 14Q0 0 14 0H241Q255 0 255 14V52H0Z"/><text class="name" x="72" y="34">SUPPLIER</text><text class="pk" x="20" y="83">PK</text><text class="field" x="62" y="83">SupplierNo</text><text class="field" x="62" y="113">Name</text><text class="field" x="62" y="143">Contact</text><text class="field" x="62" y="173">LeadTime</text></g>
  <!-- CUSTOMER one to ORDER zero-many: || at customer, o< at order -->
  <path class="rel" d="M310 200 H470"/><path class="rel" d="M330 184V216M342 184V216"/><circle cx="440" cy="200" r="9" class="rel"/><path class="rel" d="M468 200L448 183M468 200L448 217M448 183V217"/><text class="label" x="360" y="184">places</text>
  <!-- ORDER one to ORDER_LINE one-many: || at order, |< at line -->
  <path class="rel" d="M598 295 V480"/><path class="rel" d="M582 318H614M582 330H614"/><path class="rel" d="M598 478L581 453M598 478L615 453M581 453H615"/><path class="rel" d="M581 442H615"/><text class="label" x="615" y="390">contains</text>
  <!-- PRODUCT one to ORDER_LINE zero-many, orientation reversed -->
  <path class="rel" d="M725 575 H890"/><path class="rel" d="M862 559V591M874 559V591"/><circle cx="753" cy="575" r="9" class="rel"/><path class="rel" d="M727 575L747 558M727 575L747 592M747 558V592"/><text class="label" x="775" y="559">lists</text>
  <!-- SUPPLIER one to PRODUCT zero-many -->
  <path class="rel" d="M1018 295 V480"/><path class="rel" d="M1002 318H1034M1002 330H1034"/><circle cx="1018" cy="450" r="9" class="rel"/><path class="rel" d="M1018 478L1001 456M1018 478L1035 456M1001 456H1035"/><text class="label" x="1038" y="390">supplies</text>
  <rect x="55" y="345" width="310" height="250" rx="14" fill="#10151c" stroke="#30363d" stroke-width="2"/><text class="name" x="78" y="382">Notation key</text><text class="legend" x="80" y="420">||  exactly one (mandatory)</text><text class="legend" x="80" y="454">o|  zero or one (optional)</text><text class="legend" x="80" y="488">|&lt;  one or many</text><text class="legend" x="80" y="522">o&lt;  zero or many</text><text class="legend" x="80" y="565">ORDER_LINE is associative:</text><text class="legend" x="80" y="589">it resolves ORDER M:N PRODUCT.</text>
  <text class="label" x="55" y="720">Read from both directions: one CUSTOMER may place zero or many ORDERs; every ORDER belongs to exactly one CUSTOMER.</text>
</svg>
